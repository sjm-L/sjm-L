<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="Spring Boot, Java, HTML/CSS, SQL, Algorithm">
  <style>
    .t { font-family: 'Space Grotesk','Pretendard','Apple SD Gothic Neo','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .up { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
    .draw { transform-box: fill-box; transform-origin: left center; animation: draw 1s cubic-bezier(.7,0,.2,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both, blink 1.1s steps(1) infinite; }
    .pop1 { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; }
    .wipe { transform-box: fill-box; transform: scaleX(0); animation: wipe 1s cubic-bezier(.8,0,.2,1) both; }
    .reveal { animation: reveal 1s steps(1) both; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    .ping { transform-box: fill-box; animation: ping 3.6s ease-in-out infinite both; }
    @keyframes up { from { opacity: 0; transform: translateY(22px); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes wipe {
      0% { transform: scaleX(0); transform-origin: left center; }
      50% { transform: scaleX(1); transform-origin: left center; }
      50.1% { transform: scaleX(1); transform-origin: right center; }
      100% { transform: scaleX(0); transform-origin: right center; }
    }
    @keyframes reveal { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes ping { 0%, 22%, 100% { opacity: 0; transform: translate(0, 0); } 7%, 14% { opacity: 1; transform: translate(4px, -4px); } }
  </style>
  <rect x="0" y="0" width="1200" height="1" fill="#30363d"/>
  <text class="t" xml:space="preserve" x="600" y="35" font-size="17" font-weight="700" fill="#9aa1a4" letter-spacing="3" text-anchor="middle">SPRING BOOT<tspan fill="#e63b1f">   ✱   </tspan>JAVA<tspan fill="#e63b1f">   ✱   </tspan>HTML / CSS<tspan fill="#e63b1f">   ✱   </tspan>SQL<tspan fill="#e63b1f">   ✱   </tspan>ALGORITHM</text>
  <rect x="0" y="55" width="1200" height="1" fill="#30363d"/>
</svg>
