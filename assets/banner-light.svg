<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-label="jm — 배우고, 만들고, 기록합니다.">
  <style>
    .t { font-family: 'Space Grotesk','Pretendard','Apple SD Gothic Neo','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .up { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
    .draw { transform-box: fill-box; transform-origin: left center; animation: draw 1s cubic-bezier(.7,0,.2,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both, blink 1.1s steps(1) infinite; }
    .pop1 { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; }
    .wipe { transform-box: fill-box; transform: scaleX(0); animation: wipe 1s cubic-bezier(.8,0,.2,1) both; }
    .reveal { animation: reveal 1s steps(1) both; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    .ping { transform-box: fill-box; animation: ping 3.6s ease-in-out infinite both; }
    @keyframes up { from { opacity: 0; transform: translateY(22px); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes wipe {
      0% { transform: scaleX(0); transform-origin: left center; }
      50% { transform: scaleX(1); transform-origin: left center; }
      50.1% { transform: scaleX(1); transform-origin: right center; }
      100% { transform: scaleX(0); transform-origin: right center; }
    }
    @keyframes reveal { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes ping { 0%, 22%, 100% { opacity: 0; transform: translate(0, 0); } 7%, 14% { opacity: 1; transform: translate(4px, -4px); } }
  </style>
  <g class="up" style="animation-delay: 0.00s">
    <text class="t" x="0" y="28" font-size="13" font-weight="700" fill="#6d7477" letter-spacing="2.5">TECH BLOG</text>
    <text class="t" x="0" y="58" font-size="20" font-weight="700" fill="#0e0e0e">deep-c.dev</text>
  </g>
  <g class="up" style="animation-delay: 0.12s">
    <text class="t" x="400" y="28" font-size="13" font-weight="700" fill="#6d7477" letter-spacing="2.5">NOW LEARNING</text>
    <text class="t" x="400" y="58" font-size="20" font-weight="700" fill="#0e0e0e">Java · Spring Boot</text>
  </g>
  <g class="up" style="animation-delay: 0.24s">
    <text class="t" x="800" y="28" font-size="13" font-weight="700" fill="#6d7477" letter-spacing="2.5">STATUS</text>
    <text class="t" x="800" y="58" font-size="20" font-weight="700" fill="#0e0e0e">배우고 기록하는 중</text>
  </g>
  <g class="up" style="animation-delay: 0.12s">
    <circle class="pulse" cx="541" cy="23" r="4" fill="#e63b1f"/>
    <circle cx="541" cy="23" r="4" fill="#e63b1f"/>
  </g>
  <rect class="draw" style="animation-delay: 0.30s" x="0" y="86" width="1200" height="1" fill="#d8dee0"/>
  <text class="t up" style="animation-delay: 0.45s" x="-8" y="296" font-size="250" font-weight="700" fill="#0e0e0e" letter-spacing="-14">jm</text>
  <rect class="pop" style="animation-delay: 1.40s, 2.60s" x="262" y="252" width="44" height="44" fill="#e63b1f"/>
  <text class="t reveal" style="animation-delay: 0.60s" x="1200" y="178" font-size="46" font-weight="700" fill="#0e0e0e" text-anchor="end" letter-spacing="-1.5">배우고,</text>
  <rect class="wipe" style="animation-delay: 0.60s" x="1057" y="136" width="149" height="54" fill="#e63b1f"/>
  <text class="t reveal" style="animation-delay: 0.82s" x="1200" y="236" font-size="46" font-weight="700" fill="#0e0e0e" text-anchor="end" letter-spacing="-1.5">만들고,</text>
  <rect class="wipe" style="animation-delay: 0.82s" x="1057" y="194" width="149" height="54" fill="#e63b1f"/>
  <text class="t reveal" style="animation-delay: 1.04s" x="1200" y="294" font-size="46" font-weight="700" fill="#0e0e0e" text-anchor="end" letter-spacing="-1.5">기록합니다<tspan fill="#e63b1f">.</tspan></text>
  <rect class="wipe" style="animation-delay: 1.04s" x="980" y="252" width="226" height="54" fill="#e63b1f"/>
  <rect class="draw" style="animation-delay: 1.10s" x="0" y="378" width="1200" height="1" fill="#d8dee0"/>
  <rect class="draw" style="animation-delay: 1.60s" x="0" y="376" width="120" height="5" fill="#e63b1f"/>
</svg>
